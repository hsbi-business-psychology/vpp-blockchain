name: Deploy to Plesk

# Runs after CI has passed on main, or by hand for a given ref (rollback:
# `gh workflow run deploy.yml -f ref=<sha-or-tag>`).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag or branch to deploy'
        type: string
        default: main

# A deploy that is cut off halfway leaves the server with a mix of old and
# new files. Queue instead of cancelling.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build id
        id: build
        run: echo "id=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Frontend settings come from packages/frontend/.env.production.
      - name: Build
        env:
          VPP_BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          pnpm --filter @vpp/contracts run compile
          pnpm --filter @vpp/frontend run build
          pnpm --filter @vpp/backend run bundle
          bash scripts/build-deploy-ci.sh

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # deploy-ftp.sh verifies TLS against the chain the host presents and
      # refuses to upload without it.
      - name: Upload changed files and verify
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: bash scripts/deploy-ftp.sh
