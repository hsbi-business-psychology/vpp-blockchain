name: Deploy to Plesk

# Manual only. hosting.hsbi.de completes the FTPS handshake only for clients
# inside the HSBI network or VPN; GitHub-hosted runners get the greeting but
# no answer to AUTH TLS (measured 2026-10-14). Until that changes, deploy with
# `bash scripts/build-deploy.sh` from the HSBI network or VPN. This workflow
# stays for a runner that can reach the host, and fails within minutes
# instead of hanging.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit, tag or branch to deploy'
        type: string
        default: main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build id
        id: build
        run: echo "id=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Frontend settings come from packages/frontend/.env.production.
      - name: Build
        env:
          VPP_BUILD_ID: ${{ steps.build.outputs.id }}
        run: |
          pnpm --filter @vpp/contracts run compile
          pnpm --filter @vpp/frontend run build
          pnpm --filter @vpp/backend run bundle
          bash scripts/build-deploy-ci.sh

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # deploy-ftp.sh verifies TLS against the chain the host presents and
      # refuses to upload without it.
      - name: Upload changed files and verify
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          BUILD_ID: ${{ steps.build.outputs.id }}
        run: bash scripts/deploy-ftp.sh
